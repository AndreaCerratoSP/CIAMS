version: "3.9"

services:
  inventory-db:
    image: docker.io/library/postgres:16
    container_name: inventory-db_c
    environment:
      POSTGRES_USER: invuser
      POSTGRES_PASSWORD: inventorypsw
      POSTGRES_DB: inventory-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ciams-network

  auth-db:
    image: docker.io/library/mongo:7
    container_name: auth-db_c
    ports:
      - "27017:27017"
    volumes:
      - authdbdata:/data/db
    networks:
      - ciams-network

  inventory-app:
    image: inventory_c-img:latest
    container_name: inventory-app_c
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory-db
      SPRING_DATASOURCE_USERNAME: invuser
      SPRING_DATASOURCE_PASSWORD: inventorypsw
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    volumes:
      - C:\tmp\logs:/tmp/logs:z
    depends_on:
      - inventory-db
      - auth-db
    networks:
      - ciams-network

  auth-app:
    image: auth_c-img:latest
    container_name: auth-app_c
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://auth-db:27017/auth-db
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8081:8081"
    depends_on:
      - auth-db
    networks:
      - ciams-network

volumes:
  pgdata:
  authdbdata:

networks:
  ciams-network:
    driver: bridge

